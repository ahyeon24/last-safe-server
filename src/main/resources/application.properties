spring.application.name=last-safe-server

# 기본 프로필은 local. 배포 환경에서는 환경변수 SPRING_PROFILES_ACTIVE로 덮어씀
# (환경변수가 이 파일 값보다 우선 적용됨).
spring.profiles.active=local

# ODsay API 키 — 이 파일은 git에 커밋되므로 실제 값을 절대 여기 넣지 않는다(CLAUDE.md 보안 원칙).
# 배포 환경에서는 환경변수 ODSAY_API_KEY로 주입. 로컬 개발 값은 application-local.properties
# (gitignore됨)에 odsay.api-key=실제값 형태로 넣을 것 — 그쪽이 프로필별 우선순위로 이 기본값을 덮어씀.
odsay.api-key=${ODSAY_API_KEY:}
